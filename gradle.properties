#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"

#Kotlin
kotlin.code.style=official

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=34

#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.native.enableKlibsCrossCompilation=true

ksp.incremental=false
compose.ios.resources.sync=false
# iOS 模拟器目标禁用 K/N 编译缓存：避免沙箱拦截 klib/cache 的锁文件删除
kotlin.native.cacheKind.iosSimulatorArm64=none

#Publish
MODULE_NAME=KuiklyLLMProvider
MAVEN_VERSION=0.1.2
GROUP_ID=com.github.iPel.KuiklyLLMProvider
KOTLIN_VERSION_LIST=2.1.21
OHOS_KOTLIN_VERSION_LIST=2.0.21-KBA-010
KUIKLY_VERSION=2.30.0-2.1.21
KUIKLY_OHOS_VERSION=2.30.0-2.0.21-ohos
MAVEN_REPO_URL=
PROVIDER_VARIANT=bundled

# 发布凭据通过环境变量注入，不要写入本文件。
